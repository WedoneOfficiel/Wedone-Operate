name: Phoenix packages

on:
  workflow_dispatch:
  push:
    branches: [phoenix-rebuild]
    paths:
      - "phoenix/**"
      - "phoenix_entry.py"
      - "phoenix-macos.spec"
      - "requirements-phoenix.txt"
      - "scripts/validate_phoenix_distribution.py"
      - ".github/workflows/build-phoenix.yml"

permissions:
  contents: read

concurrency:
  group: phoenix-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Phoenix Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-phoenix.txt pyinstaller
          python -c "import importlib.metadata as m; print('Qt packages:', [(d.metadata['Name'], d.version) for d in m.distributions() if d.metadata['Name'].lower().startswith('pyside6')])"
      - name: Prepare application icon
        shell: pwsh
        run: Copy-Item icon.png phoenix.ico
      - name: Build application
        shell: pwsh
        run: |
          $qml = python -c "import PySide6, pathlib; print(pathlib.Path(PySide6.__file__).parent / 'Qt' / 'qml')"
          if (-not (Test-Path -LiteralPath $qml -PathType Container)) { throw "Qt QML runtime directory is missing: $qml" }
          if (-not (Test-Path -LiteralPath (Join-Path $qml "QtQuick") -PathType Container)) { throw "QtQuick QML modules are missing: $qml" }
          pyinstaller --noconfirm --clean --windowed --name "Wedone Operate Phoenix" --icon phoenix.ico --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineQuick --exclude-module PySide6.QtWebEngineWidgets --add-data "$qml;PySide6/Qt/qml" --add-data "phoenix/ui/qml;phoenix/ui/qml" --add-data "icon.png;." phoenix_entry.py
      - name: Validate packaged runtime
        run: python scripts/validate_phoenix_distribution.py "dist/Wedone Operate Phoenix"
      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          & "dist/Wedone Operate Phoenix/Wedone Operate Phoenix.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        run: Compress-Archive -Path "dist/Wedone Operate Phoenix" -DestinationPath "Wedone-Operate-Phoenix-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Wedone-Operate-Phoenix-Windows-x64
          path: Wedone-Operate-Phoenix-Windows-x64.zip
          if-no-files-found: error

  macos:
    name: Phoenix macOS Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-phoenix.txt pyinstaller
          python -c "import importlib.metadata as m; print('Qt packages:', [(d.metadata['Name'], d.version) for d in m.distributions() if d.metadata['Name'].lower().startswith('pyside6')])"
      - name: Install icon tooling
        run: python -m pip install Pillow
      - name: Prepare macOS application icon
        run: |
          cp icon.png phoenix.ico
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open("icon.png").convert("RGBA")
          iconset = Path("Phoenix.iconset")
          iconset.mkdir(exist_ok=True)
          for size in (16, 32, 128, 256, 512):
              source.resize((size, size), Image.Resampling.LANCZOS).save(iconset / f"icon_{size}x{size}.png")
              source.resize((size * 2, size * 2), Image.Resampling.LANCZOS).save(iconset / f"icon_{size}x{size}@2x.png")
          PY
          iconutil -c icns Phoenix.iconset -o phoenix.icns
      - name: Build macOS application bundle
        run: pyinstaller --noconfirm --clean phoenix-macos.spec
      - name: Validate bundle structure and signature
        run: |
          app="dist/Wedone Operate Phoenix.app"
          test -d "$app" || { echo "::error::PyInstaller did not produce the expected .app bundle"; exit 1; }
          test -f "$app/Contents/Info.plist" || { echo "::error::Info.plist is missing"; exit 1; }
          test -x "$app/Contents/MacOS/Wedone Operate Phoenix" || { echo "::error::Application executable is missing"; exit 1; }
          python scripts/validate_phoenix_distribution.py "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Smoke-test packaged macOS application
        run: |
          app="dist/Wedone Operate Phoenix.app"
          QT_QPA_PLATFORM=offscreen "$app/Contents/MacOS/Wedone Operate Phoenix" --smoke-test
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Wedone Operate Phoenix.app" "Wedone-Operate-Phoenix-macOS-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Wedone-Operate-Phoenix-macOS-arm64
          path: Wedone-Operate-Phoenix-macOS-arm64.zip
          if-no-files-found: error

  linux:
    name: Phoenix Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-phoenix.txt pyinstaller
          python -c "import importlib.metadata as m; print('Qt packages:', [(d.metadata['Name'], d.version) for d in m.distributions() if d.metadata['Name'].lower().startswith('pyside6')])"
      - name: Prepare application icon
        run: cp icon.png phoenix.ico
      - name: Build application
        shell: bash
        run: |
          QML_DIR="$(python -c 'import PySide6, pathlib; print(pathlib.Path(PySide6.__file__).parent / "Qt" / "qml")')"
          test -f "$QML_DIR/QtQuick/Controls/qmldir"
          pyinstaller --noconfirm --clean --windowed --name "wedone-operate-phoenix" --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineQuick --exclude-module PySide6.QtWebEngineWidgets --add-data "$QML_DIR:PySide6/Qt/qml" --add-data "phoenix/ui/qml:phoenix/ui/qml" --add-data "icon.png:." phoenix_entry.py
      - name: Validate packaged runtime
        run: python scripts/validate_phoenix_distribution.py dist/wedone-operate-phoenix
      - name: Smoke-test packaged application
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/wedone-operate-phoenix/wedone-operate-phoenix --smoke-test
      - name: Package
        run: cd dist && zip -qr ../Wedone-Operate-Phoenix-Linux-x64.zip wedone-operate-phoenix
      - uses: actions/upload-artifact@v4
        with:
          name: Wedone-Operate-Phoenix-Linux-x64
          path: Wedone-Operate-Phoenix-Linux-x64.zip
          if-no-files-found: error
